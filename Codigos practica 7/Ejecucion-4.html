<!DOCTYPE html> <!-- Documento HTML5 -->
<html lang="es">
<head>
<meta charset="UTF-8"> <!-- Acentos y ñ -->
<title>Formularios con checkbox</title> <!-- Titulo de la pestaña -->
</head>
<body> <!-- Contenido visible -->
<h2>Formularios con checkbox</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre"><br>
Selecciona los lenguajes que conozcas:
<br>
<!-- checkbox: casillas, se pueden marcar varias -->
<input type="checkbox" name="Java">Java <br>
<input type="checkbox" name="Python"> Python <br>
<input type="checkbox" name="C#">C# <br>
<input type="checkbox" name="Flutter"> Flutter <br>
</form>
</body>
</html>
