<!DOCTYPE html> <!-- Documento HTML5 -->
<html lang="es">
<head>
<meta charset="UTF-8"> <!-- Acentos y ñ -->
<title>Formulario con limitaciones</title> <!-- Titulo de la pestaña -->
</head>
<body> <!-- Contenido visible -->
<h2>Formulario con limitaciones</h2>
<form action="" method="post">
Ingresa tu nombre:
<!-- disabled: campo deshabilitado, no se puede escribir -->
<input type="text" name="nombre" disabled><br>
Contraseña:
<!-- maxlength: maximo de caracteres permitidos -->
<input type="password" name="pass" maxlength="5"><br>
Comentarios:
<!-- readonly: solo lectura, no se puede modificar -->
<textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
